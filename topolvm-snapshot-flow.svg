<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="#f8fafc"/>

  <!-- title bar -->
  <rect x="0" y="0" width="1600" height="86" fill="url(#headerGrad)"/>
  <text x="40" y="38" font-size="28" font-weight="700" fill="#ffffff">TopoLVM Online Snapshots — Off-Cluster Backup &amp; Restore</text>
  <text x="40" y="66" font-size="16" fill="#93c5fd">Native Linux LVM performance + S3/GCS/Azure durability · encryption · deduplication · compression</text>

  <!-- ===================== BACKUP LANE ===================== -->
  <text x="40" y="130" font-size="20" font-weight="700" fill="#059669">① BACKUP</text>
  <line x1="40" y1="140" x2="1560" y2="140" stroke="#d1fae5" stroke-width="3"/>

  <!-- user / VolumeSnapshot -->
  <rect x="40" y="170" width="230" height="110" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="155" y="203" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">User / CronJob</text>
  <rect x="62" y="218" width="186" height="44" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="155" y="240" font-size="13" font-weight="600" fill="#1d4ed8" text-anchor="middle">kubectl create</text>
  <text x="155" y="255" font-size="13" font-weight="600" fill="#1d4ed8" text-anchor="middle">VolumeSnapshot</text>

  <!-- controller -->
  <rect x="330" y="170" width="240" height="110" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="203" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">topolvm-controller</text>
  <text x="450" y="228" font-size="12.5" fill="#475569" text-anchor="middle">reconciles VolumeSnapshot,</text>
  <text x="450" y="246" font-size="12.5" fill="#475569" text-anchor="middle">schedules snapshotter pod on</text>
  <text x="450" y="264" font-size="12.5" fill="#475569" text-anchor="middle">the node that owns the LV</text>

  <!-- storage node -->
  <rect x="630" y="160" width="560" height="330" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="910" y="192" font-size="16" font-weight="700" fill="#92400e" text-anchor="middle">Storage Node (local NVMe/SSD)</text>

  <!-- VG box -->
  <rect x="655" y="210" width="240" height="250" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="775" y="236" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">LVM Volume Group</text>

  <rect x="678" y="252" width="194" height="58" rx="8" fill="#fde68a" stroke="#d97706"/>
  <text x="775" y="276" font-size="13" font-weight="700" fill="#78350f" text-anchor="middle">Thin LV (PVC data)</text>
  <text x="775" y="294" font-size="12" fill="#92400e" text-anchor="middle">PostgreSQL · MySQL · Kafka …</text>

  <rect x="678" y="330" width="194" height="58" rx="8" fill="#fef3c7" stroke="#d97706" stroke-dasharray="6 3"/>
  <text x="775" y="354" font-size="13" font-weight="700" fill="#78350f" text-anchor="middle">Thin COW Snapshot</text>
  <text x="775" y="372" font-size="12" fill="#92400e" text-anchor="middle">instant · space-efficient</text>

  <line x1="775" y1="310" x2="775" y2="330" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="775" y="430" font-size="12.5" fill="#64748b" text-anchor="middle">lvmd (gRPC) creates the</text>
  <text x="775" y="447" font-size="12.5" fill="#64748b" text-anchor="middle">snapshot — app keeps running</text>

  <!-- snapshotter pod -->
  <rect x="930" y="230" width="235" height="210" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="1047" y="260" font-size="14" font-weight="700" fill="#065f46" text-anchor="middle">topolvm-snapshotter</text>
  <text x="1047" y="278" font-size="12" fill="#047857" text-anchor="middle">(per-snapshot pod)</text>
  <text x="1047" y="306" font-size="12.5" fill="#065f46" text-anchor="middle">mounts snapshot read-only</text>
  <rect x="952" y="322" width="190" height="92" rx="8" fill="#d1fae5" stroke="#059669"/>
  <text x="1047" y="347" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">Backup engine (Restic)</text>
  <text x="1047" y="368" font-size="12.5" fill="#047857" text-anchor="middle">🔒 Encryption</text>
  <text x="1047" y="386" font-size="12.5" fill="#047857" text-anchor="middle">🧩 Deduplication</text>
  <text x="1047" y="404" font-size="12.5" fill="#047857" text-anchor="middle">🗜 Compression</text>

  <!-- snapshot -> snapshotter -->
  <line x1="872" y1="359" x2="930" y2="359" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- remote storage -->
  <rect x="1280" y="200" width="280" height="250" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1420" y="234" font-size="15" font-weight="700" fill="#5b21b6" text-anchor="middle">Remote Object Storage</text>
  <!-- bucket icon -->
  <path d="M 1370 262 h 100 l -12 66 h -76 z" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <ellipse cx="1420" cy="262" rx="50" ry="10" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1420" y="302" font-size="12.5" font-weight="600" fill="#5b21b6" text-anchor="middle">S3 · GCS · Azure</text>
  <rect x="1302" y="352" width="236" height="74" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-dasharray="6 3"/>
  <text x="1420" y="377" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">SnapshotBackupStorage</text>
  <text x="1420" y="395" font-size="12" fill="#6d28d9" text-anchor="middle">CRD — backend config</text>
  <text x="1420" y="412" font-size="12" fill="#6d28d9" text-anchor="middle">(bucket, region, credentials)</text>

  <!-- backup arrows -->
  <line x1="270" y1="225" x2="330" y2="225" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="225" x2="630" y2="225" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="212" font-size="11.5" fill="#64748b" text-anchor="middle">spawn</text>
  <line x1="1165" y1="330" x2="1280" y2="300" stroke="#059669" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="1222" y="298" font-size="12.5" font-weight="700" fill="#059669" text-anchor="middle">ship data</text>

  <!-- ===================== RESTORE LANE ===================== -->
  <text x="40" y="560" font-size="20" font-weight="700" fill="#2563eb">② RESTORE</text>
  <line x1="40" y1="570" x2="1560" y2="570" stroke="#dbeafe" stroke-width="3"/>

  <!-- new PVC -->
  <rect x="40" y="600" width="230" height="120" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="155" y="633" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">New PVC</text>
  <rect x="62" y="648" width="186" height="56" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="155" y="672" font-size="13" font-weight="600" fill="#1d4ed8" text-anchor="middle">dataSource:</text>
  <text x="155" y="690" font-size="13" font-weight="600" fill="#1d4ed8" text-anchor="middle">VolumeSnapshot</text>

  <!-- LogicalVolume CR -->
  <rect x="330" y="600" width="250" height="120" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="455" y="633" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">LogicalVolume CR</text>
  <rect x="352" y="648" width="206" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="5 3"/>
  <text x="455" y="672" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle">annotation:</text>
  <text x="455" y="690" font-size="11.5" font-weight="600" fill="#b91c1c" text-anchor="middle">snapshot-restore-required</text>

  <!-- topolvm-node -->
  <rect x="640" y="600" width="250" height="120" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="765" y="633" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">topolvm-node</text>
  <text x="765" y="660" font-size="12.5" fill="#475569" text-anchor="middle">defers restore until the pod</text>
  <text x="765" y="678" font-size="12.5" fill="#475569" text-anchor="middle">first mounts the volume</text>
  <text x="765" y="702" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="middle">NodePublishVolume</text>

  <!-- restore snapshotter -->
  <rect x="950" y="600" width="250" height="120" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="1075" y="633" font-size="15" font-weight="700" fill="#065f46" text-anchor="middle">topolvm-snapshotter</text>
  <text x="1075" y="660" font-size="12.5" fill="#047857" text-anchor="middle">pulls data from remote,</text>
  <text x="1075" y="678" font-size="12.5" fill="#047857" text-anchor="middle">decrypts &amp; writes into the</text>
  <text x="1075" y="696" font-size="12.5" fill="#047857" text-anchor="middle">fresh LV on any healthy node</text>

  <!-- workload -->
  <rect x="1280" y="600" width="280" height="120" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="1420" y="636" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Workload runs 🎉</text>
  <text x="1420" y="663" font-size="12.5" fill="#475569" text-anchor="middle">StatefulSet mounts the volume —</text>
  <text x="1420" y="681" font-size="12.5" fill="#475569" text-anchor="middle">standard CSI flow, data restored</text>
  <text x="1420" y="699" font-size="12.5" fill="#475569" text-anchor="middle">even after total node loss</text>

  <!-- restore arrows -->
  <line x1="270" y1="660" x2="330" y2="660" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <line x1="580" y1="660" x2="640" y2="660" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <line x1="890" y1="660" x2="950" y2="660" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <line x1="1200" y1="660" x2="1280" y2="660" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- remote -> restore snapshotter (down-left curve) -->
  <path d="M 1420 450 C 1420 540 1160 560 1090 600" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#arrow)"/>
  <text x="1330" y="540" font-size="12.5" font-weight="700" fill="#7c3aed">restore stream</text>

  <!-- footer -->
  <rect x="0" y="810" width="1600" height="90" fill="#0f172a"/>
  <text x="40" y="847" font-size="14.5" font-weight="600" fill="#e2e8f0">⚡ Near bare-metal latency (node-local LVM)   ·   🔒 Encrypted, deduplicated, compressed backups   ·   ☁️ Survives node loss via S3/GCS/Azure</text>
  <text x="40" y="874" font-size="13" fill="#94a3b8">github.com/anisurrahman75/topolvm   ·   helm repo add topolvm https://anisurrahman75.github.io/topolvm</text>
</svg>
